# Every pull request and every push to main: the checks `pnpm check` runs, then the end-to-end tests and Lighthouse on the
# production build. The action versions are pinned by commit, as in hundo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # (pnpm's version comes from packageManager in package.json)
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # (fails when pnpm-lock.yaml no longer matches package.json, as Vercel's install would)
      - run: pnpm install --frozen-lockfile
      # (gero's module and programs come from the release app/lab/gero.ts pins, checked against its hashes by scripts/gero-assets.mjs;
      # the cache only saves the download, since the script hashes what it finds. `test` needs them before `build` would fetch them,
      # and pnpm runs no `pre` scripts, so this step does)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/gero
          key: gero-${{ hashFiles('app/lab/gero.ts') }}
      - run: pnpm gero
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # (Storybook builds through vite.config.ts with React Router's plugins taken out: this catches a change that breaks that)
      - run: pnpm build-storybook

  # Playwright drives the runner's own Chrome (channel "chrome"), so no browser is downloaded.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # (the build the tests serve fetches gero's module; see the check job)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/gero
          key: gero-${{ hashFiles('app/lab/gero.ts') }}
      - run: google-chrome --version
      - run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright
          path: test-results
          retention-days: 14

  # Lighthouse on the production build: the phone's preset held to lighthouserc.json, the desktop's to lighthouserc.desktop.json.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # (the build fetches gero's module; see the check job)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/gero
          key: gero-${{ hashFiles('app/lab/gero.ts') }}
      - run: pnpm build
        id: build
      # (the runner's Chrome won't start in Lighthouse's sandbox; hundo's run passes the same flag on CI)
      - run: pnpm lighthouse --collect.settings.chromeFlags=--no-sandbox
      # (a computer gets the desktop, so the same pages again on the desktop preset; it runs even when the phone's run failed, but
      # not when the build did)
      - run: pnpm lighthouse:desktop --collect.settings.chromeFlags=--no-sandbox
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: |
            .cache/lighthouse
            .cache/lighthouse-desktop
          # (.cache is a hidden folder, which upload-artifact leaves out unless told)
          include-hidden-files: true
          retention-days: 14
