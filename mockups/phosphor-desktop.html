<!doctype html><html><head><meta charset="utf-8"><title>desk</title></head><body style="margin:20px;width:680px;font-family:sans-serif">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
#jd{--dith:color-mix(in srgb,var(--fg) 20%,var(--bg));position:relative;height:480px;border-radius:22px;overflow:hidden;background:var(--bg);color:var(--fg);font:18px/1.1 VT323,monospace;font-variant-ligatures:none;user-select:none;cursor:default;text-align:left}
#jd.glow{text-shadow:0 0 2px var(--dim)}
#jd.scan::after{content:"";position:absolute;inset:0;z-index:9999;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.6) 100%)}
#jd.flick::before{content:"";position:absolute;inset:0;z-index:9998;pointer-events:none;background:var(--fg);opacity:0;animation:fl 4s infinite}
@keyframes fl{0%,100%{opacity:0}48%{opacity:.03}50%{opacity:0}53%{opacity:.02}}
@media (prefers-reduced-motion:reduce){#jd.flick::before{animation:none}}
#jd [hidden]{display:none!important}
#jd p{margin:0}
#jd a{color:inherit}
#jd img{image-rendering:pixelated;flex:none}
#jd button{all:unset;box-sizing:border-box;display:inline-block;text-align:center;min-width:72px;height:24px;padding:0 12px;border:1px solid var(--fg);background:var(--bg);color:var(--fg);font:inherit;line-height:22px;cursor:default;white-space:nowrap}
#jd button:active:not(:disabled),#jd button.in{background:var(--fg);color:var(--bg);text-shadow:none}
#jd button.dflt{outline:1px solid var(--fg);outline-offset:2px}
#jd button:focus-visible{outline:1px dashed var(--fg);outline-offset:2px}
#jd input[type=text],#jd textarea{all:unset;box-sizing:border-box;border:1px solid var(--fg);background:var(--bg);color:var(--fg);font:inherit;padding:2px 6px;user-select:text;caret-color:var(--fg)}
#jd textarea{white-space:pre-wrap;overflow:hidden}
#jd input[type=checkbox],#jd input[type=radio]{all:unset;box-sizing:border-box;flex:none;width:14px;height:14px;border:1px solid var(--fg);padding:2px;background-clip:content-box}
#jd input[type=radio]{border-radius:50%}
#jd input:checked{background-color:var(--fg)}
#jd label{display:flex;align-items:center;gap:7px}
.dim{color:var(--dim)}
.mbar{position:absolute;top:0;left:0;right:0;height:24px;box-sizing:border-box;display:flex;align-items:stretch;padding:0 10px;border-bottom:1px solid var(--fg);background:var(--bg);z-index:9000}
.mt{position:relative;display:flex;align-items:center;padding:0 9px}
.mt.open{background:var(--fg);color:var(--bg);text-shadow:none}
.clk{margin-left:auto;display:flex;align-items:center}
.dd{position:absolute;top:23px;left:0;min-width:180px;padding:3px 0;background:var(--bg);color:var(--fg);border:1px solid var(--fg);box-shadow:3px 3px 0 var(--dim)}
.mi{position:relative;height:21px;display:flex;align-items:center;padding:0 24px;white-space:nowrap}
.mi:hover:not(.off){background:var(--fg);color:var(--bg)}
.mi.off{color:var(--dim)}
.mi.chk::before{content:"";position:absolute;left:9px;top:8px;width:6px;height:6px;background:currentColor}
.msep{border-top:1px dashed var(--dim);margin:3px 0}
.desk{position:absolute;inset:24px 0 0 0;background-image:repeating-conic-gradient(var(--dith) 0 25%,transparent 0 50%);background-size:2px 2px}
#jd.plain .desk{background-image:none}
.dicons{position:absolute;right:8px;top:10px;bottom:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ic{width:88px;display:flex;flex-direction:column;align-items:center;gap:2px;outline:none}
.ic span{background:var(--bg);padding:0 4px;line-height:18px;text-align:center}
.ic.on span{background:var(--fg);color:var(--bg);text-shadow:none}
.win{position:absolute;display:flex;flex-direction:column;box-sizing:border-box;background:var(--bg);border:1px solid var(--fg);box-shadow:3px 3px 0 var(--dim)}
.win.dlg{border:3px double var(--fg)}
.tb{flex:none;height:22px;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 3px 0 7px;border-bottom:1px solid var(--fg);touch-action:none}
.win.act .tb{background:var(--fg);color:var(--bg);text-shadow:none}
.tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbc{display:flex;gap:3px}
#jd .tbc button{min-width:0;width:16px;height:16px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.win.act .tbc button{border-color:var(--bg)}
#jd .tbc button:active img{transform:translate(1px,1px)}
.info{flex:none;display:flex;justify-content:space-between;padding:0 8px;border-bottom:1px solid var(--fg);color:var(--dim)}
.wb{flex:1;min-height:0;overflow:hidden;padding:10px;display:flex;flex-direction:column}
.grip{position:absolute;right:1px;bottom:1px;width:12px;height:12px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 0 45%,var(--fg) 45% 55%,transparent 55% 70%,var(--fg) 70% 80%,transparent 80%)}
.win.shaded .wb,.win.shaded .info,.win.shaded .grip{display:none}
.grid{display:flex;flex-wrap:wrap;gap:10px 2px;align-content:flex-start}
.win .ic{width:92px}
.list{width:100%;border-collapse:collapse}
.list th{text-align:left;font-weight:400;padding:0 6px;border-bottom:1px solid var(--fg)}
.list td{padding:1px 6px;white-space:nowrap}
.list img{vertical-align:-3px;margin-right:6px}
.lr.on td{background:var(--fg);color:var(--bg);text-shadow:none}
.ihead{display:flex;gap:12px;align-items:center}
.rule{border-top:1px solid var(--fg);margin:8px 0}
.kv{display:grid;grid-template-columns:11ch minmax(0,1fr);gap:2px 10px;align-items:start}
.kv>span{overflow-wrap:anywhere}
.kv .pl{align-self:center}
.pics{display:flex;align-items:center;gap:12px}
.kv2{display:grid;grid-template-columns:64px 1fr;gap:6px 8px;align-items:center}
.cp{display:grid;grid-template-columns:84px 1fr;gap:12px 10px}
.opts{display:flex;gap:16px;flex-wrap:wrap}
.btns{display:flex;justify-content:flex-end;gap:12px;margin-top:auto;padding-top:10px}
.al{flex:1;display:flex;gap:16px;align-items:center}
.txt{white-space:pre-wrap;user-select:text}
.tout{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;white-space:pre-wrap;word-break:break-word}
.tin{display:flex;margin:0}
#jd .tin input{all:unset;flex:1;color:var(--fg);font:inherit;caret-color:var(--fg)}
.win:focus{outline:none}
#jd button:disabled{color:var(--dim);border-color:var(--dim)}
.shot{flex:1;min-height:0;margin:0;display:flex;flex-direction:column;gap:8px}
.sbox{flex:1;min-height:0;display:flex}
#jd .sbox img{flex:1;min-width:0;width:100%;height:100%;object-fit:contain;image-rendering:auto}
.sbar{flex:none;display:flex;gap:12px;align-items:flex-start}
.cap{flex:1;min-width:0;height:2.2em;overflow:hidden;margin:0}
.nav{display:flex;gap:6px}
#jd .nav button{min-width:0;width:32px;padding:0;display:flex;align-items:center;justify-content:center}
#jd .nav button:active:not(:disabled){background:var(--bg)}
#jd .nav button:active:not(:disabled) img{transform:translate(1px,1px)}
.md{white-space:normal}
.md>*{margin:0}
#jd .md>*+*{margin-top:1lh}
#jd .md>h2+*,#jd .md>h3+*{margin-top:0}
.md h2,.md h3{font:inherit}
.md ul{list-style:none;padding:0}
.md li{display:grid;grid-template-columns:2ch minmax(0,1fr)}
.md h2::before,.md h3::before,.md li::before{color:var(--dim)}
.md h2::before{content:"# "/""}.md h3::before{content:"## "/""}.md li::before{content:"-"/""}
.md code{font:inherit}.md code::before,.md code::after{content:"`"/"";color:var(--dim)}
.md p,.md li>span{overflow-wrap:anywhere}
#jd .wb.flush{padding:0}
.doc{flex:1;min-height:0;overflow-y:auto;padding:10px;user-select:text;outline:none}
#jd .wb.scr{overflow-y:auto}
.doc::-webkit-scrollbar,.scr::-webkit-scrollbar{width:14px}
.doc::-webkit-scrollbar-track,.scr::-webkit-scrollbar-track{border-left:1px solid var(--fg);background:repeating-conic-gradient(var(--dim) 0 25%,transparent 0 50%) 0 0/2px 2px}
.doc::-webkit-scrollbar-thumb,.scr::-webkit-scrollbar-thumb{background:var(--bg);border:1px solid var(--fg);border-right:0}
.doc::-webkit-scrollbar-button:end:increment,.scr::-webkit-scrollbar-button:end:increment{height:14px;display:block;background:var(--bg);border-left:1px solid var(--fg)}
.full{position:absolute;inset:0;z-index:9500;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<h2 class="sr-only">Phosphor desktop mockup: a monochrome CRT desktop with a menu bar, icons, movable windows and dialogs.</h2>

// The projects as app/core/projects.ts holds them (an unknown link is '').
const PJ=[
["hundo","Hundo","web","Web app","Spoiler-aware, installable completion guides for single-player games: one app per game, all built on one shared core.","React 19, Vite, Vercel, Upstash Redis","https://hundo.quest","https://github.com/salty-max/hundo",shots('web')],
["farseer","Farseer","web","Web app","Every World of Warcraft blue post from the US and EU forums in one installable app, with filters and push notifications.","React 19, Vite, Tailwind 4, Hono, Postgres","https://farseer-mu.vercel.app","https://github.com/salty-max/farseer",shots('web')],
["lucarne","Lucarne","web","Web app","The schedule of football fixtures and the French TV channel showing each one, from Ligue 1 to the World Cup, with live scores and push alerts, in a revival of broadcast teletext.","React 19, Vite, Tailwind 4, Hono, Bun, SQLite","https://lucarne.fr","https://github.com/salty-max/lucarne",shots('web')],
["wow-locker","WoWLocker","web","Web app","Your World of Warcraft Classic characters on your phone: gear and talents, what changed during a session, bags and mail, a Hardcore character's deaths and close calls. An installable web app with an addon, in an interface based on the game.","React 19, Vite, Tailwind 4, Hono, Postgres, Lua","https://wow-locker.app","https://github.com/salty-max/wow-locker",[]],

["hearthtale","Hearthtale","addons","WoW addon","Keeps a journal for your World of Warcraft character as you play. Quests, close calls, new places and the people you travel with become entries in your character's voice, to read in game or on hearthtale.app.","Lua, React, Vite, Tailwind, Hono, Postgres","https://hearthtale.app","https://github.com/salty-max/hearthtale",shots('game')],
["lorekeepers-codex","Lorekeeper's Codex","addons","WoW addon","A book of Azeroth's lore that fills in as you explore: a place, a person, a creature or a quest can reveal a page about the history behind it, each page an original text.","Lua","","https://github.com/salty-max/lorekeepers-codex",[]],
["mealbook","Mealbook","addons","WoW addon","A chef's cookbook that fills in as you learn to cook, and the road from your cooking skill to 300: the surest recipe at each step, where to learn it, and what to buy or gather.","Lua","","https://github.com/salty-max/mealbook",[]],
["second-wind","Second Wind","addons","WoW addon","A debrief after a close call or a death in World of Warcraft: the hits that hurt most, how your health fell, and which potions or abilities were ready but went unused.","Lua","","https://github.com/salty-max/second-wind",[]],
["keyring","Keyring","addons","WoW addon","Gathers your addons' minimap buttons into a drawer, leaving one key on the minimap.","Lua","","https://github.com/salty-max/keyring",[]],
["goodwill","Goodwill","addons","WoW addon","Every faction's road to Exalted from where you stand, and a chapter of its story at each standing you reach.","Lua","","https://github.com/salty-max/goodwill",[]],
["palaver","Palaver","addons","WoW addon","Quests and conversations with NPCs in a panel beside them, read and answered from the keyboard.","Lua","","https://github.com/salty-max/palaver",[]],

["yonder","Yonder","addons","WoW addon","Riddles to solve, rare creatures to hunt and a record of what you find along the way, with notes from an Explorers' League naturalist.","Lua","","https://github.com/salty-max/yonder",[]],
["yours-truly","Yours Truly","addons","WoW addon","Letters from the people you helped: finish a quest chain that changed someone's life, and they write to you. The letter waits at the next mailbox you open.","Lua","","https://github.com/salty-max/yours-truly",[]],
["gero","Gero","engines","Virtual machine","A 16-bit virtual machine, assembler, disassembler and Lua-style language compiler, all in pure Zig. Gero Lab, its playground in the browser, runs it as WebAssembly.","Zig, WebAssembly","https://gero-lab.vercel.app","https://github.com/salty-max/gero",[]],
["addon-kit","addon-kit","tools","Lua kit","The Lua code shared by most of the addons here, a copy in each: the books' windows and look, events, settings, achievements, the minimap button and the translations. Its scripts package, test and release them.","Lua, TypeScript, Bun","","https://github.com/salty-max/addon-kit",[]],

["harness","harness","tools","Dev tool","A small harness for working with Claude Code sessions on a project: a task board, a quiet runner for checks, a review packet and verdict before each commit, and git hooks that refuse to push an unchecked or unreviewed tree.","TypeScript, Bun","","https://github.com/salty-max/harness",[]]];

t:v=>setTheme(v),crt:()=>{const on=!(fx.scan||fx.glow||fx.flick);['scan','glow'].forEach(k=>setFx(k,on));if(!on)setFx('flick',false)},dith:()=>setDith(!dith),

const MENUS=[
()=>[['About Jelly-OS','about'],['-'],['Control Panel','panel']],
()=>[['Open',sel&&sel.isConnected?'open':null],['Get Info',sel&&sel.isConnected&&sel.dataset.a.startsWith('p:')?'getinfo':null],['-'],['Close Window',cur?'close':null]],
()=>[['Undo'],['-'],['Cut'],['Copy'],['Paste']],

()=>{const L=Object.keys(W).filter(k=>W[k].t).map(k=>[W[k].t,'focus:'+k,k===cur]);return L.length?L:[['No windows']]}];
function openMenu(mt){closeMenu();const L=MENUS[+mt.dataset.m]();mt.classList.add('open');inv(mt,true);const dd=document.createElement('div');dd.className='dd';dd.innerHTML=L.map(x=>x[0]==='-'?'<div class="msep"></div>':`<div class="mi${x[1]?'':' off'}${x[2]?' chk':''}" data-a="${x[1]||''}">${esc(x[0])}</div>`).join('');mt.appendChild(dd);openM=mt}
function closeMenu(){if(!openM)return;openM.classList.remove('open');inv(openM,false);const d=openM.querySelector('.dd');if(d)d.remove();openM=null}
root.addEventListener('click',e=>{
if(booting)return done();

const mi=e.target.closest('.mi');if(mi){if(!mi.classList.contains('off')){closeMenu();act(mi.dataset.a)}return}

closeMenu();
const g=e.target.closest('[data-go]');if(g){e.preventDefault();return act(g.dataset.go)}
const it=e.target.closest('.ic,.lr');if(!it)return select(null);
if(sel===it)return act(it.dataset.a);select(it)});

const vw=e.target.closest('.win'),wid=vw&&Object.keys(W).find(k=>W[k].el===vw);if(!wid)return;
// The Info window's default button answers Enter; Esc closes the README's window and the viewer.
if(e.key==='Enter'&&wid[0]==='i'&&!e.target.closest('button,a'))return act('r:'+wid.slice(1));
if(e.key==='Escape'&&W[wid].K&&wid[0]==='r')return close(wid);
if(!W[wid].S)return;
if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();vgo(wid,W[wid].i+(e.key==='ArrowLeft'?-1:1))}else if(e.key==='Escape')close(wid)});
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>setTheme(b.dataset.q));$('rb').onclick=()=>boot();
const tick=()=>{const d=new Date();$('clk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};tick();setInterval(tick,1000);
