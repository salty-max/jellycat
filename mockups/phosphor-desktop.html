hd:()=>folder('hd','Jelly HD',HD),projects:()=>folder('projects','Projects',PRJ),f:k=>folder('f'+k,KIND[k],items(k)),p:id=>info(id),
trash:()=>folder('trash','Trash',[]),
readme:()=>win('readme','Readme',`<div class="txt">${esc(README)}</div>`,340,210),
mail:()=>win('mail','New Message','<div class="kv2"><span class="dim">To</span><input type="text" value="hello@your-domain"><span class="dim">Subject</span><input type="text"></div><textarea style="flex:1;margin-top:8px;resize:none"></textarea><div class="btns"><button class="dflt" data-go="send">Send</button></div>',370,250),
send:()=>alertBox('Sending is turned off in this mockup.'),
panel:()=>{const el=win('panel','Control Panel',`<div class="cp"><span class="dim">Phosphor</span><div class="opts">${['green','amber','white'].map(t=>`<label><input type="radio" name="ph" value="${t}"${t===theme?' checked':''}>${t[0].toUpperCase()+t.slice(1)}</label>`).join('')}</div><span class="dim">Effects</span><div class="opts">${[['scan','Scanlines'],['glow','Glow'],['flick','Flicker']].map(([k,n])=>`<label><input type="checkbox" data-fx="${k}"${fx[k]?' checked':''}>${n}</label>`).join('')}</div><span class="dim">Desktop</span><div class="opts"><label><input type="checkbox" data-dith${dith?' checked':''}>Dither pattern</label></div></div>`,400,170);if(el.dataset.ok)return;el.dataset.ok=1;el.addEventListener('change',e=>{const t=e.target;if(t.name==='ph')setTheme(t.value);else if(t.dataset.fx)setFx(t.dataset.fx,t.checked);else if('dith' in t.dataset)setDith(t.checked)})},
term:()=>{const el=win('term','Terminal','<div class="tout"></div><form class="tin"><span class="tps"></span><input aria-label="Command" autocomplete="off" spellcheck="false"></form>',410,240);const inp=el.querySelector('input');inp.focus({preventScroll:true});if(el.dataset.ok)return;el.dataset.ok=1;
let cwd=[];const o=el.querySelector('.tout'),ps=el.querySelector('.tps'),pth=()=>'~'+(cwd.length?'/'+cwd.join('/'):''),pr=s=>{const d=document.createElement('div');d.textContent=s;o.appendChild(d);while(o.children.length>40)o.firstChild.remove()},upd=()=>{ps.textContent='guest@jellycat:'+pth()+'$ '};
pr('Type help for the commands.');upd();el.querySelector('.wb').addEventListener('click',()=>inp.focus({preventScroll:true}));
el.querySelector('form').onsubmit=e=>{e.preventDefault();const v=inp.value;inp.value='';pr('guest@jellycat:'+pth()+'$ '+v);const [c,...a]=v.trim().split(/\s+/),arg=a.join(' ');
if(!c);else if(c==='help')pr('ls [dir]  cd [dir]  cat <file>  open <project>  clear');
else if(c==='clear')o.textContent='';
else if(c==='ls'){const n=node(resolve(cwd,arg||'.'));pr(n&&n.d?Object.keys(n.d).map(k=>k+(n.d[k].d?'/':'')).join('  '):`ls: ${arg}: no such directory`)}
else if(c==='cd'){const s=resolve(cwd,arg||'~'),n=node(s);if(n&&n.d)cwd=s;else pr(`cd: ${arg}: no such directory`)}
else if(c==='cat'){const n=arg&&node(resolve(cwd,arg));if(!arg)pr('cat: name a file');else if(!n)pr(`cat: ${arg}: no such file`);else if(n.d)pr(`cat: ${arg}: is a directory`);else pr(n.p?ptext(n.p):n.f)}
else if(c==='open'){const p=findP(arg);if(p){info(p[0]);pr('opened '+p[1])}else pr(arg?`open: no project matches ${arg}`:'open: name a project')}
else pr(`jsh: ${c}: command not found`);upd()}},
about:()=>alertBox('Jelly-OS 1.0<br>Jellycat Studio<br><span class="dim">Mockup</span>'),
shutdown:()=>alertBox('Shut down Jelly-OS?','<button data-c="x">Cancel</button><button class="dflt" data-go="sdok">Shut Down</button>'),
sdok:()=>{Object.keys(W).forEach(close);$('off').hidden=false},
restart:()=>boot(),
open:()=>{if(sel&&sel.isConnected)act(sel.dataset.a)},
getinfo:()=>{if(sel&&sel.dataset.a.startsWith('p:'))info(sel.dataset.a.slice(2))},
close:()=>{if(cur)close(cur)},
vicon:()=>{if(isF()){W[cur].view='icon';fdraw(cur)}},vlist:()=>{if(isF()){W[cur].view='list';fdraw(cur)}},
t:v=>setTheme(v),crt:()=>{const on=!(fx.scan||fx.glow||fx.flick);['scan','glow'].forEach(k=>setFx(k,on));if(!on)setFx('flick',false)},dith:()=>setDith(!dith),
focus:id=>focus(id)};
function act(a){const [k,v]=a.split(/:(.*)/);if(A[k])A[k](v)}
const MENUS=[
()=>[['About Jelly-OS','about'],['-'],['Control Panel','panel']],
()=>[['Open',sel&&sel.isConnected?'open':null],['Get Info',sel&&sel.isConnected&&sel.dataset.a.startsWith('p:')?'getinfo':null],['-'],['Close Window',cur?'close':null]],
()=>[['Undo'],['-'],['Cut'],['Copy'],['Paste']],
()=>[['by Icon',isF()?'vicon':null,isF()&&W[cur].view==='icon'],['by Name',isF()?'vlist':null,isF()&&W[cur].view==='list']],
()=>[['Green phosphor','t:green',theme==='green'],['Amber phosphor','t:amber',theme==='amber'],['White phosphor','t:white',theme==='white'],['-'],['CRT effects','crt',fx.scan||fx.glow||fx.flick],['Dither pattern','dith',dith],['-'],['Restart','restart'],['Shut Down...','shutdown']],
()=>{const L=Object.keys(W).filter(k=>W[k].t).map(k=>[W[k].t,'focus:'+k,k===cur]);return L.length?L:[['No windows']]}];
function openMenu(mt){closeMenu();const L=MENUS[+mt.dataset.m]();mt.classList.add('open');inv(mt,true);const dd=document.createElement('div');dd.className='dd';dd.innerHTML=L.map(x=>x[0]==='-'?'<div class="msep"></div>':`<div class="mi${x[1]?'':' off'}${x[2]?' chk':''}" data-a="${x[1]||''}">${esc(x[0])}</div>`).join('');mt.appendChild(dd);openM=mt}
function closeMenu(){if(!openM)return;openM.classList.remove('open');inv(openM,false);const d=openM.querySelector('.dd');if(d)d.remove();openM=null}
root.addEventListener('click',e=>{
if(booting)return done();
if(!$('off').hidden){$('off').hidden=true;return boot()}
const mi=e.target.closest('.mi');if(mi){if(!mi.classList.contains('off')){closeMenu();act(mi.dataset.a)}return}
const mt=e.target.closest('.mt');if(mt){if(openM===mt)closeMenu();else openMenu(mt);return}
closeMenu();
const g=e.target.closest('[data-go]');if(g)return act(g.dataset.go);
const it=e.target.closest('.ic,.lr');if(!it)return select(null);
if(sel===it)return act(it.dataset.a);select(it)});
root.addEventListener('dblclick',e=>{const it=e.target.closest('.ic,.lr');if(it&&sel!==it)act(it.dataset.a)});
root.addEventListener('mouseover',e=>{const mt=e.target.closest('.mt');if(openM&&mt&&mt!==openM)openMenu(mt)});
root.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();const it=e.target.closest('.ic');if(it&&e.key==='Enter')act(it.dataset.a)});
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>setTheme(b.dataset.q));$('rb').onclick=()=>boot();
const tick=()=>{const d=new Date();$('clk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};tick();setInterval(tick,1000);
function done(){clearTimeout(bt);booting=false;$('boot').hidden=true;A.projects()}
function boot(){clearTimeout(bt);closeMenu();Object.keys(W).forEach(close);select(null);booting=true;$('boot').hidden=false;bt=setTimeout(done,matchMedia('(prefers-reduced-motion: reduce)').matches?0:1300)}
refresh();boot();
</script>
</body></html>
