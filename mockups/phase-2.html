release v0.5.5, and its output and step count are what gero.wasm v0.5.5 printed when run (21 Nov 2026); projects and studio lines

<section class="fold"><h2 class="fh inv"><img data-i="folder" data-s="1" data-v="1" alt=""><span>Tools</span><span class="n">3 items</span></h2>
<ul class="cards">
<li class="card"><h3><a>addon-kit</a><img data-i="next" data-s="2" alt=""></h3><p class="dim">Lua kit</p><p class="ds">The Lua code shared by most of the addons here, a copy in each: the books' windows and look, events, settings, achievements, the minimap button and the translations. Its scripts package, test and release them.</p></li>

<script>
// gero's examples/lang/fizzbuzz.gr, as samples.json holds it in release v0.5.5.
const SRC={fizzbuzz:`-- fizzbuzz.gr — the classic, in Gero.
--
-- Prints 1..15, replacing multiples of 3 with "Fizz", of 5 with
-- "Buzz", and of both with "FizzBuzz". Exercises a \`for\` range loop,
-- the \`if\`/\`elif\`/\`else\` chain, the \`%\` operator, and \`print\` of both
-- integers and strings.
--
-- Run:
--   gero compile fizzbuzz.gr -o fizzbuzz.gx
--   gero run fizzbuzz.gx
def main()
  for i in 1..16
    if i % 15 == 0
      print "FizzBuzz"
    elif i % 3 == 0
      print "Fizz"
    elif i % 5 == 0
      print "Buzz"
    else
      print i
    end
  end
end
`};
// The 1-bit grids: the desktop mockup's, and two new icons (the Lab's flask, Contact's envelope) and the picker's 8x8 arrow.
const IC={
disk:['','','','','################','#oooooooooooooo#','#o############o#','#oooooooooooooo#','#oooooooooooooo#','#o##ooooooooooo#','#oooooooooooooo#','################','.##..........##.'],
folder:['','','.#####..........','#ooooo#.........','################','#oooooooooooooo#','#oooooooooooooo#','#oooooooooooooo#','#oooooooooooooo#','#oooooooooooooo#','#oooooooooooooo#','#oooooooooooooo#','#oooooooooooooo#','################'],
doc:['','..#########.....','..#ooooooo##....','..#ooooooo#o#...','..#ooooooo####..','..#oooooooooo#..','..#o######ooo#..','..#oooooooooo#..','..#o########o#..','..#oooooooooo#..','..#o#######oo#..','..#oooooooooo#..','..#o########o#..','..#oooooooooo#..','..############..'],
term:['','################','#oooooooooooooo#','#o############o#','#o#o##########o#','#o##o#########o#','#o#o###oooo###o#','#o############o#','#o############o#','#o############o#','#oooooooooooooo#','################','....########....','...##########...'],
trash:['','......####......','..############..','..#oooooooooo#..','..############..','...#oooooooo#...','...#oo#oo#oo#...','...#oo#oo#oo#...','...#oo#oo#oo#...','...#oo#oo#oo#...','...#oo#oo#oo#...','...#oo#oo#oo#...','...#oooooooo#...','...##########...'],
panel:['','','################','#oooooooooooooo#','#oo#ooo#ooo#ooo#','#o###oo#ooo#ooo#','#oo#ooo#ooo#ooo#','#oo#ooo#oo###oo#','#oo#ooo#ooo#ooo#','#oo#oo###oo#ooo#','#oo#ooo#ooo#ooo#','#oooooooooooooo#','################'],
cat:['','..#..........#..','.#o#........#o#.','.#oo########oo#.','.#oooooooooooo#.','#oooooooooooooo#','#oo##oooooo##oo#','#oo##oooooo##oo#','#oooooo##oooooo#','#oooooooooooooo#','.#ooo#oooo#ooo#.','..#ooo####ooo#..','...##oooooo##...','.....######.....'],
lab:['','.....######.....','......#oo#......','......#oo#......','......#oo#......','.....#oooo#.....','....#oooooo#....','...#oooooooo#...','...##########...','..###o########..','..#########o##..','.##############.','.######o#######.','.##############.'],
mail:['','','','################','##oooooooooooo##','#o#oooooooooo#o#','#oo#oooooooo#oo#','#ooo#oooooo#ooo#','#oooo#oooo#oooo#','#ooooo####ooooo#','#oooooooooooooo#','#oooooooooooooo#','################']};
const GL={x:['##....##','###..###','.######.','..####..','..####..','.######.','###..###','##....##'],min:['','','','########','########','','',''],max:['########','########','#......#','#......#','#......#','#......#','#......#','########'],next:['..#.....','..##....','..###...','..####..','..####..','..###...','..##....','..#.....'],down:['','','#######.','.#####..','..###...','...#....','','']};
// Draws a grid as an image in a frame's colours: the outline in --fg, the inside in --bg; inverted (data-v="1") swaps them.
function draw(img){const fr=img.closest('.jd,.ph,.og'),cs=getComputedStyle(fr),F=cs.getPropertyValue('--fg').trim(),B=cs.getPropertyValue('--bg').trim();
const n=img.dataset.i,s=+img.dataset.s,v=img.dataset.v==='1',m=IC[n]||GL[n],sz=IC[n]?16:8,c=document.createElement('canvas');c.width=c.height=sz*s;const g=c.getContext('2d');
m.forEach((r,y)=>{for(let x=0;x<r.length;x++){const ch=r[x];if(ch==='.')continue;g.fillStyle=(ch==='#')!==v?F:B;g.fillRect(x*s,y*s,s,s)}});img.src=c.toDataURL();img.width=img.height=sz*s}
document.querySelectorAll('[data-src]').forEach(e=>{const t=SRC[e.dataset.src];if(e.tagName==='TEXTAREA')e.value=t;else e.textContent=t});
document.querySelectorAll('img[data-i]').forEach(draw);
document.fonts.ready.then(()=>{
document.querySelectorAll('textarea[data-scroll]').forEach(t=>{t.scrollTop=(+t.dataset.scroll)*19.8});
document.querySelectorAll('.sc[data-bottom]').forEach(s=>{s.scrollTop=s.scrollHeight});
document.body.dataset.ready='1'});
</script>
