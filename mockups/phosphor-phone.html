<!doctype html><html><head><meta charset="utf-8"><title>phone</title></head><body style="margin:20px;width:680px;font-family:sans-serif">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
#ph{position:relative;width:412px;height:839px;margin:0 auto;overflow:hidden;background:var(--bg);color:var(--fg);font:20px/1.2 VT323,monospace;font-variant-ligatures:none;text-align:left}
#ph *{box-sizing:border-box}
#ph [hidden]{display:none!important}
#ph a{color:inherit;text-decoration:none}
#ph p,#ph h1,#ph h2,#ph h3,#ph ul,#ph dl,#ph dd,#ph figure{margin:0}
#ph h1,#ph h2,#ph h3{font:inherit}
#ph button{all:unset;box-sizing:border-box;cursor:pointer}
#ph :focus-visible{outline:1px dashed var(--fg);outline-offset:2px}
#ph.glow .sc,#ph.glow .vw{text-shadow:0 0 2px var(--dim)}
.inv{background:var(--fg);color:var(--bg);text-shadow:none!important}
.dim{color:var(--dim)}
.u{text-decoration:underline!important}
/* the document's scroll: in the page this is the window, so the browser's own bars can hide on scroll */
.sc{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
/* the CRT layer: fixed over the viewport in the page, over the frame here; takes no taps, hidden from screen readers */
.crt{position:absolute;inset:0;z-index:9999;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.6) 100%)}
#ph:not(.scan) .crt{display:none}
.flk{position:absolute;inset:0;z-index:9998;pointer-events:none;background:var(--fg);opacity:0;display:none}
#ph.flick .flk{display:block;animation:fl 4s infinite}
@keyframes fl{0%,100%{opacity:0}48%{opacity:.03}50%{opacity:0}53%{opacity:.02}}
@media (prefers-reduced-motion:reduce){#ph.flick .flk{display:none;animation:none}}
/* header: the desktop's menu bar, sticky */
.hd{position:sticky;top:0;z-index:20;height:44px;display:flex;align-items:center;padding:0 max(16px,calc((100% - 608px) / 2));border-bottom:1px solid var(--fg);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;height:44px;padding-right:8px}
#ph .cpb{margin-left:auto;margin-right:-6px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
#ph .cpb:active,#ph .cpb[aria-expanded=true]{background:var(--fg);color:var(--bg)}
#ph .cpb:active svg path:first-child,#ph .cpb[aria-expanded=true] svg path:first-child{fill:var(--fg)}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 28px}
.h1{font-size:40px!important;line-height:40px}
.kv{display:grid;grid-template-columns:8ch minmax(0,1fr);column-gap:10px}
.kv dt{color:var(--dim)}
.kv dd{overflow-wrap:anywhere}
.kv a{display:inline-block;min-height:24px}
.intro p{margin-top:8px}
.intro .kv{margin-top:14px}
/* the folders, as tabs that jump to each */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tabs a{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:1px solid var(--fg)}
.tabs a:active{background:var(--fg);color:var(--bg);text-shadow:none}
.tabs a:active .dim{color:var(--bg)}
/* a folder: its title bar in inverse video, sticky under the header, and its projects as cards */
.fold{margin-top:30px;scroll-margin-top:44px}
.fh{position:sticky;top:44px;z-index:10;display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;margin:0 -16px;padding-left:16px;padding-right:16px}
.fh .n{margin-left:auto}
.cards{list-style:none;padding:0 3px 3px 0;margin-top:14px!important;display:grid;gap:16px}
.card{position:relative;border:1px solid var(--fg);box-shadow:3px 3px 0 var(--dim);background:var(--bg);padding:8px 12px 10px}
.card h3{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:24px!important;line-height:28px}
.card h3 a::after{content:"";position:absolute;inset:0}
.card h3 a:focus-visible{outline:none}
.card:has(a:focus-visible){outline:1px dashed var(--fg);outline-offset:4px}
.card:has(a:active){background:var(--fg);color:var(--bg);text-shadow:none}
.card:has(a:active) .dim{color:var(--bg)}
.card .ds{margin-top:6px}
.card .px{margin-top:6px}
/* a project's page */
.back{display:inline-flex;align-items:center;gap:8px;height:40px;margin:-8px 0 6px;padding-right:10px}
.back:active{background:var(--fg);color:var(--bg);text-shadow:none}
.pj .kind{margin-top:4px}
.pj .ds{margin-top:12px}
.facts{margin-top:16px;padding:8px 0;border-top:1px solid var(--fg);border-bottom:1px solid var(--fg)}
.h2{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--fg);padding-bottom:2px}
.shots{margin-top:26px}
.list{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:14px}
.shot{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:6px}
.shot.phone{flex:0 1 calc(50% - 8px)}
#ph .shot button{display:block;border:1px solid var(--fg);line-height:0}
.shot img{display:block;width:100%;height:auto;background:#000}
.shot figcaption{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
/* the README, in the shell's double-bordered pane with its path set in the border */
.pane{position:relative;border:4px double var(--fg);padding:14px 10px 10px;margin-top:40px}
.pt{position:absolute;top:-15px;left:10px;max-width:calc(100% - 28px);padding:0 6px;background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt.r{left:auto;right:10px}
.md>*+*{margin-top:1lh!important}
.md>h2+*,.md>h3+*{margin-top:0!important}
.md ul{list-style:none;padding:0}
.md li{display:grid;grid-template-columns:2ch minmax(0,1fr)}
.md h2::before,.md h3::before,.md li::before{color:var(--dim)}
.md h2::before{content:"# "/""}.md h3::before{content:"## "/""}.md li::before{content:"-"/""}
.md code{font:inherit}.md code::before,.md code::after{content:"`"/"";color:var(--dim)}
.md p,.md li>span{overflow-wrap:anywhere}
.md a{text-decoration:underline!important}
/* previous and next */
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px;padding:0 3px 3px 0}
.pn a{display:flex;flex-direction:column;justify-content:center;min-height:56px;padding:4px 10px;border:1px solid var(--fg);box-shadow:3px 3px 0 var(--dim)}
.pn a.nx{text-align:right;align-items:flex-end}
.pn a:active{background:var(--fg);color:var(--bg);text-shadow:none}
.pn a:active .dim{color:var(--bg)}
.pn .lb{display:flex;align-items:center;gap:6px}
/* the foot of every page */
.ft{border-top:1px solid var(--fg)}
.ft .wrap{padding-top:14px;padding-bottom:20px}
/* the Control Panel: a window docked at the bottom, a modal dialog over the page, which a 1-bit dither dims */
.bd{position:absolute;inset:0;z-index:8500;background:repeating-conic-gradient(rgba(0,0,0,.72) 0 25%,transparent 0 50%) 0 0/2px 2px}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:8600;max-width:624px;margin:0 auto;background:var(--bg);border:1px solid var(--fg);box-shadow:3px 3px 0 var(--dim)}
.sheet .tb{display:flex;align-items:center;height:32px;padding-left:12px}
.sheet .tb h2{flex:1}
#ph .sheet .xb{width:44px;height:32px;display:flex;align-items:center;justify-content:center}
.sheet .xb span{display:flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--bg);color:var(--fg)}
#ph .sheet .xb:active span{background:var(--fg);color:var(--bg);outline:1px solid var(--bg)}
#ph .sheet .xb:focus-visible{outline:1px dashed var(--bg);outline-offset:-3px}
.cp{display:grid;grid-template-columns:8ch 1fr;column-gap:10px;padding:8px 12px 10px}
.cp>.dim{line-height:44px}
.opts{display:flex;flex-wrap:wrap;column-gap:18px}
.opts label{display:flex;align-items:center;gap:8px;height:44px;cursor:pointer}
#ph input[type=checkbox],#ph input[type=radio]{all:unset;box-sizing:border-box;flex:none;width:16px;height:16px;border:1px solid var(--fg);padding:3px;background-clip:content-box}
#ph input[type=radio]{border-radius:50%}
#ph input:checked{background-color:var(--fg)}
#ph input:focus-visible{outline:1px dashed var(--fg);outline-offset:2px}
/* the viewer: full screen, a modal dialog */
.vw{position:absolute;inset:0;z-index:9000;overscroll-behavior:contain;background:var(--bg);display:flex;flex-direction:column;gap:12px;padding:24px 16px 16px}
.vp{flex:1;min-height:0;margin:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:16px 10px 10px}
.vbox{flex:0 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.vbox img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.vcap{flex:none;min-height:2.4em}
.vb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
#ph .vb button{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border:1px solid var(--fg)}
#ph .vb button:active:not([aria-disabled=true]){background:var(--fg);color:var(--bg);text-shadow:none}
#ph .vb button[aria-disabled=true]{color:var(--dim);border-color:var(--dim)}
.ph-missing{display:flex;align-items:center;justify-content:center;aspect-ratio:var(--ar);background:repeating-conic-gradient(color-mix(in srgb,var(--fg) 20%,var(--bg)) 0 25%,transparent 0 50%) 0 0/2px 2px;color:var(--fg);padding:12px;text-align:center;line-height:1.2}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

ots":[{"src":"/screenshots/hearthtale/journal-desktop","size":"desktop","w":1440,"h":900,"alt":"A journal page the addon wrote for Brannok, a test dwarf hunter"},{"src":"/screenshots/hearthtale/epitaph-desktop","size":"desktop","w":1440,"h":900,"alt":"The epitaph the addon wrote for Pippa, a test gnome mage who died on Hardcore"},{"src":"/screenshots/hearthtale/journal-phone","size":"phone","w":780,"h":1688,"alt":"Brannok's journal page on a phone, below the six sample pages to choose from"}]},{"slug":"lorekeepers-codex","name":"Lorekeeper's Codex","folder":"addons","kind":"WoW addon","description":"A book of Azeroth's lore that fills in as you explore: a place, a person, a creature or a quest can reveal a page about the history behind it, each page an original text.","stack":"Lua","link":"-","source":"https://github.com/salty-max/lorekeepers-codex","shots":[]},{"slug":"mealbook","name":"Mealbook","folder":"addons","kind":"WoW addon","description":"A chef's cookbook that fills in as you learn to cook, and the road from your cooking skill to 300: the surest recipe at each step, where to learn it, and what to buy or gather.","stack":"Lua","link":"-","source":"https://github.com/salty-max/mealbook","shots":[]},{"slug":"second-wind","name":"Second Wind","folder":"addons","kind":"WoW addon","description":"A debrief after a close call or a death in World of Warcraft: the hits that hurt most, how your health fell, and which potions or abilities were ready but went unused.","stack":"Lua","link":"-","source":"https://github.com/salty-max/second-wind","shots":[]},{"slug":"keyring","name":"Keyring","folder":"addons","kind":"WoW addon","description":"Gathers your addons' minimap buttons into a drawer, leaving one key on the minimap.","stack":"Lua","link":"-","source":"https://github.com/salty-max/keyring","shots":[]},{"slug":"goodwill","name":"Goodwill","folder":"addons","kind":"WoW addon","description":"Every faction's road to Exalted from where you stand, and a chapter of its const RM={"hundo":"# Hundo\n\nHundo is a set of completion guides for single-player games, one installable web app per game. There are six: Link's Awakening, Red Dead Redemption, Echoes of Wisdom, Dark Souls Remastered, Hollow Knight and Hollow Knight: Silksong, each on a subdomain of hundo.quest. A guide follows the game chapter by chapter, with a box to tick for each thing to get or do, and by default hides later chapters until the reader reveals them. Progress is kept in the browser, and the guides work offline.\n\n## How it's built\n\nThe guides, the shared core, the component stories and the sync API are one pnpm workspace. `packages/core` is the app: the React 19 pages, components, stores and styles, and the function that builds a guide's whole Vite and Vitest config from its brand. A guide's folder holds its chapter data and config in plain TypeScript, its own tests, any panels of its own, and its look: a palette, two fonts, a corner preset, an icon and banners.\n\n- Core reads a guide only through virtual modules (`virtual:guide/config` and two more) that the build points at the guide's folder. A guide reads core only through named subpath exports.\n- Saves have one versioned format, validated on every load and import. Each guide's tests pin its storage keys, since a changed key would start every reader over.\n- A missable must cite two sources on different hosts, which the tests check; anything less certain goes into the guide's `facts-to-verify.md`.\n\n`services/sync`, deployed on its own at api.hundo.quest, lets a reader's devices share progress through a six-digit code, with no account. Progress is flattened to keys stamped by a hybrid clock, and the later stamp wins. In Redis a key's values are sorted-set members that are never rewritten, so two devices pushing at once can't overwrite each other. The merge code is one file, byte for byte the same in the guides and the server, and a test holds the two copies equal.\n\nVisit counts carry no cookie and no id: a guide sends a few numbers, and the server adds them to daily totals and keeps nothing else. They are built to fit the exemption from consent that CNIL, the French regulator, gives audience measurement.\n\n## How it's checked\n\n- `pnpm check` runs lint, typecheck, tests and build for the packages a change reaches. CI runs them over every package, and `main` takes changes only through a pull request whose CI check passed.\n- Core's shared test suites run against every guide, and each guide typechecks core against its own config.\n- Every component story renders in Chrome under each guide's palette, in light and dark, and axe checks it; a violation fails the run.\n- Lighthouse CI audits every guide's production build on each pull request, with accessibility, best practices and SEO held at 100.\n- A sync test runs two simulated browsers against the real API handler on an in-memory store.\n\nWork on the repository runs under the [harness](/projects/harness).\n","farseer":"# Farseer\n\nFarseer is an installable web app that collects World of Warcraft blue posts (posts by Blizzard's developers and community managers, and its official news) from the US and EU English forums into a single feed. Readers filter it by game (Retail, Classic or Forever), topic, region and author, read a post beside the player message it answers, save posts for offline, and get push notifications matching their own filters. The app is in English and French.\n\n## How it's built\n\nIt is a Turborepo of Bun workspaces: `apps/api` (Hono, Drizzle, Postgres), `apps/web` (React 19, Vite, Tailwind 4, TanStack Router and Query, vite-plugin-pwa) and `packages/shared`, the wire contract both sides import. It was built from [Lucarne](/projects/lucarne)'s template and shares its monorepo, stack and push code.\n\nA tick every minute polls the US and EU forums' public blue trackers and pushes what's new; every 15th minute it also re-checks the ten latest hotfix, patch-notes, PTR and maintenance threads of the past week for edits. A fresh database is backfilled instead, with no pushes. In production the tick is a Vercel Cron call to a single function, and a lease row in Postgres keeps two ticks from running at once, so two instances never push the same post.\n\n- Crossposts: two posts count as one when they share an author (the EU name's numeric suffix stripped), fall within 48 hours, and have near-identical titles and text as bags of words.\n- Chatter: replies by community managers and other staff are left out of the feed when they sit in a player's thread or answer a player's post; their updates to Blizzard's own threads (hotfix entries, PTR notes) stay. Thread openers, developers and official news are never left out.\n- Web Push is written without a library: VAPID and aes128gcm payload encryption on Web Crypto and `fetch`. Each notification is written on the server in the language its device stored, and subscriptions are accepted only for known browser push services.\n- Forum HTML is sanitized with DOMPurify before it renders. Feed filters live in the URL, read marks and saved posts on the device, and the service worker answers API requests network first, so opened posts stay readable offline.\n\n## How it's checked\n\n- The project's rule is that typecheck, lint, tests and the web build pass before a change is done; there is no CI. A pre-commit hook runs ESLint on staged files, and commitlint holds messages to Conventional Commits.\n- Bun's test runner covers classification, crosspost detection, the chatter rule, push filters and encryption, and the API routes through Hono's `app.request()`; the post renderer, `RichText`, renders under happy-dom with React Testing Library.\n- `db:sim` drives the real notification path (filters, copy, encryption, delivery) against a fake push service with three subscriptions, checks which ones fire, then runs it again to prove a post is pushed only once.\n","lucarne":"# Lucarne\n\nLucarne is an installable web app that lists football fixtures with the French TV channel carrying each match where one holds the rights, in competitions including Ligue 1, 2 and 3, the French cups, the Premier League, La Liga, the Bundesliga, UEFA's club competitions, the Nations League and the World Cup. It adds live scores, match pages and push alerts for the matches a reader flags or their followed teams play. Its interface revives broadcast teletext: three-digit page numbers, four coloured FastText keys, the seven teletext colours and a self-hosted teletext typeface. It is in French and English, on Paris time.\n\n## How it's built\n\nIt is a Turborepo of Bun workspaces: `apps/api` (Hono, Drizzle, Postgres), `apps/web` (React 19, Vite, Tailwind 4, TanStack Router and Query, vite-plugin-pwa) and `packages/shared`, the wire types both sides import so the contract can't drift. One Bun process serves the JSON API, the built app and the scheduler from one origin, with no separate front-end host and no CORS.\n\n- Broadcasters are mostly a data table: French rights are sold almost entirely by competition, so a match's channel resolves from rules bounded by start and end dates. Ligue 1's split rights resolve to both channels as partial rules, and a per-match override table takes precedence when filled. No channel is hard-coded.\n- Fixtures and scores come from API-Football under one daily request budget. A single `live=all` request each minute updates every live score. During play, events and statistics are refreshed only for matches on someone's radar; lineups, predictions and post-match details are fetched for every match under the same budget, and a reserve keeps the score poll running on the busiest days. Browsers read only the app's own database, so visitors cost no quota.\n- Each minute, a daily or weekly job that missed its slot while the host was asleep or down runs late.\n- Web Push is written on Web Crypto and `fetch`, with no library. Each notification is written on the server in the language its device stored, titled with the fixture so alerts from simultaneous matches stay apart.\n\n## How it's checked\n\n- CI on every push to `main` and every pull request runs typecheck, lint, tests and build, all four even when an early one fails, plus shellcheck over the shell scripts.\n- Bun's test runner covers the extracted logic (broadcaster resolution, budget and gating, match status, push delivery) and the routes' auth and fallbacks through Hono's `app.request()`; components render under happy-dom with React Testing Library.\n- `db:sim` drives the real poller jobs against a faked API-Football through a whole match, from kickoff to full time and ratings, checking the database and the pushes at each step.\n- A pre-commit hook runs ESLint on staged files, and commitlint holds messages to Conventional Commits.\n","wow-locker":"# WoWLocker\n\nWoWLocker is an installable web app for following World of Warcraft Classic characters from a phone, with an addon that records what the public profile can't show. The site covers Classic Era, Hardcore, Season of Discovery, TBC Anniversary and MoP Classic, and the addon the first three. The addon adds a detailed timeline, session summaries, bags, bank and mail, zone maps of deaths and close calls, and offline reminders.\n\n## How it's built\n\nThe site shares [Farseer](/projects/farseer)'s monorepo, stack and push code: a Hono and Drizzle API on Postgres, a React 19 web app and shared wire types. A scheduler tick refreshes from Battle.net the characters opened in the last 30 days, fallen ones once a day, and a pure diff turns each new snapshot into timeline events.\n\n- The addon, in Lua 5.1, records events into its saved file, which the game writes at logout or `/reload`; [Ravenpost](/projects/ravenpost) carries that file to the site. The API matches characters by the Battle.net ids inside their GUID, never by name, accepts uploads only for characters a Battle.net login proved are the account's, and checks and clamps every field as untrusted data.\n- Battle.net's API has no talent data for Classic, so the Classic Era and TBC Anniversary talent trees, like the interface textures and the fully explored zone maps, are built from the game's own files.\n- A Battle.net login makes the account; the access token is never kept, and the session cookie is stored only as a SHA-256 hash. Every per-viewer answer goes through one privacy module: an owned character's bags, bank, mail, gold and position stay its owner's unless shared. Row-level security is on for every table, with no policies, so Supabase's public REST API serves none of them, and rate limits guard whatever costs a Battle.net call or a stored row.\n- Production has no long-lived process: the web app on Vercel's CDN, the API in one function, the tick run by Vercel Cron under a database lease, and short-lived state in Postgres with expiry times.\n\n## How it's checked\n\n- CI on every push to `main` and every pull request runs typecheck, lint, tests and build, with integration tests of the upload and refresh lifecycle against a freshly migrated Postgres.\n- The addon's simulation replays a game session under LuaJIT and asserts every recording. CI also builds the release zip with the BigWigs packager, publishing nothing, and checks it holds exactly the addon folder.\n- `scripts/release.sh` bumps every version, runs the checks, commits, tags and pushes. The release workflow publishes the zip on GitHub and, only when the addon's version changed, CurseForge and Wago; `--hold` leaves the stores to a later run by hand.\n- A pre-push hook refuses a tree without a passing check, and a scheduled job checks that `/api/status` answers, which needs a recent scheduler run.\n","ravenpost":"# Ravenpost\n\nRavenpost is a small desktop app for macOS and Windows that uploads what some of the World of Warcraft addons on this site save. The game writes an addon's file only at logout or `/reload`; a few seconds later Ravenpost sends each character's journal to [Hearthtale](/projects/hearthtale), the WoWLocker addon's file to [WoWLocker](/projects/wow-locker), and, for players who opt in to sharing in Hearthtale, Lorekeeper's Codex, Yonder or Second Wind, what the game showed them of the world to the addons' shared database. It runs from the menu bar or the tray.\n\n## How it's built\n\nThe core is Go; the window is React 19 in the system's own webview through Wails, so no browser is bundled.\n\n- Sync: Ravenpost checks the saved files' times every 3 seconds and uploads only when a file's hash, or the player's selection, changed. Hearthtale's site gets only the fields it reads. Saved files are parsed as data, never executed.\n- Sign-in: a local listener, Battle.net in the browser, then a two-minute code bound to a secret the app keeps (PKCE's way), traded over HTTPS for a token, so the browser's history holds no token. The same address carries a passport signed with Ed25519, good for ten minutes and one use, which Hearthtale checks with the public key in its own code to give Ravenpost its upload token there.\n- Sharing: the addons' opt-in collector, part of [addon-kit](/projects/addon-kit), keeps quests' texts, creatures, NPCs' lines and loot in an account-wide file in each of those four addons. Ravenpost sends only the entries new or changed since the last upload, and never the player's name, class, race or chat. They wait in Ravenpost's inbox, a Hono server that keeps uploads as files in a private store, with no database, until [wow-data](/projects/wow-data)'s daily job merges them.\n- Windows builds are unsigned, so the app never starts PowerShell, `cmd` or any other script host; links open through a direct Win32 call. A release build is reproducible: the same commit gives the same file.\n- A daily ping carries only a random install id (the inbox keeps its hash), the version, the system, which links are made and how many addons share. The app never updates itself, and its window is in English and French.\n\n## How it's checked\n\nCI runs these on a macOS runner for every push to `main` and every pull request. `scripts/check.sh` runs all but `govulncheck`, and a pre-push hook refuses a tree without a passing run of it:\n\n- The window's typecheck and build, and the generated TypeScript bindings, which must match the Go service.\n- `gofmt`, `go vet` for macOS and for Windows, and `go test`, whose tests never touch the machine's own config or login items. The parser is tested on a saved file written by WoWLocker's addon simulation.\n- The inbox's typecheck and tests, and the download page's Astro check, build and content security policy check.\n- `govulncheck` for both targets, failing on any reachable Go advisory.\n","hearthtale":"# Hearthtale\n\nHearthtale is a World of Warcraft addon that keeps a journal for the player's character, and hearthtale.app, where the journal can also be read. Each stretch between two rests (a logout at an inn, in a city or by a campfire, or the first logout after four hours of play) becomes an entry in the first person, told differently by each race. On Hardcore, a death closes the journal with an epitaph. It runs on Classic Era, Hardcore, Season of Discovery and World of Warcraft: Forever.\n\n## How it's built\n\nThe addon keeps a recorder, which stores facts, apart from a writer, which turns them into prose when the journal is read. The writer's sentences are data: Markdown files in `writing/`, each line tagged with the conditions it needs, a race's own lines beside them, and, for a quest with a story, a line on what its work was for. `scripts/build.ts` compiles them into one data file per game and checks every phrase.\n\n- Game data comes from [wow-data](/projects/wow-data), the window from [addon-kit](/projects/addon-kit). One generated table holds how the game writes names (with or without \"the\", a plural), counted over its quest texts and NPCs' speech.\n- The record is saved as ids wherever an id gives the name back, and the written journal is saved beside it word for word, so a finished entry keeps its words.\n- A French journal is told again from the same facts. A line without its French fails the build, and the French tables ship as a second addon loaded on demand.\n\nThe site is a Bun workspace: a Hono API on Postgres, a React PWA, and a shared package mirroring the addon's saved file. The site never writes a journal; [Ravenpost](/projects/ravenpost) uploads it after a logout. Journals are private, owned through a Battle.net sign-in or a code typed in the game, and a share link leaves out the player's notes. Database scripts refuse a database off the machine unless given `--prod`, which the seed never takes, a rule a test enforces.\n\n## How it's checked\n\n- A simulated game client replays lives on both games, asserting every recording.\n- The writer's test writes hundreds of imaginary lives: every sentence must be reachable, and a finished entry must not change when the next comes. A writer refactor keeps every journal byte for byte, and the audit plays each race from level 1 to 30 on the game's real quests.\n- CI runs the addon's checks that need no other repository and the site's typecheck, lint, tests and build; a version tag reruns the addon's checks before publishing to GitHub, CurseForge and Wago.\n- A daily job rebuilds the tables from wow-data's pins and, when one changes, opens a pull request with the journals compared before and after. A regenerated table must keep every id a saved file may hold.\n","lorekeepers-codex":"# Lorekeeper's Codex\n\nLorekeeper's Codex is a World of Warcraft addon: a book of the world's history that the player fills in by playing. A place entered, a figure met, a creature killed, a quest finished or a book read can each unlock a page, written as a note from Archesonus, Royal Historian of Ironforge; a Horde character's copy adds margin notes from Parqual Fintallas of the Undercity. A Library keeps the texts the character reads, and a Soundtrack tab collects the game's music. It runs on Classic Era, Hardcore, Season of Discovery and World of Warcraft: Forever, in English and French.\n\n## How it's built\n\nEach page is a Markdown file under `content/`, its unlock rules in its front matter: an area, a creature met or killed, a quest, a reputation, a map position, a text read. A paragraph or an unlock can belong to one game only. `scripts/build.ts` checks the ids, the rules, the links between pages and the place names, then writes one content file per game.\n\n- Unlocks work in every client language: place names in the pages resolve to area ids from the client's tables, through [wow-data](/projects/wow-data), and a book is known by its title in every language. Where a page was found is saved as ids.\n- The Library copies a text in full from the game's own reader, one page per frame. Letters written by players are never copied.\n- Finds, the Library's texts among them, go into one codex shared by the account's characters; a Hardcore character keeps its own.\n- `scripts/when.ts` gives the earliest moment a page can unlock and what follows it in the game: a writer's check that a page tells no more than the player has seen.\n- The lore stops at the original game, Forever's own pages drawing on Forever's texts, and period texts win over later retellings.\n\nThe windows and achievements come from [addon-kit](/projects/addon-kit). Each translated page is stamped with the hash of the English it came from, so a changed English page shows its translations as stale.\n\n## How it's checked\n\n- `bun run check` lints the Lua, rebuilds the content and language files, and fails if a committed one differs.\n- A simulated game client replays a session on both games; on the paper look, it checks that every text reads at 4.5 to 1 contrast.\n- CI runs these checks and packs the release zip without publishing; a version tag runs them again before publishing to GitHub, CurseForge and Wago.\n- A daily job rebuilds the areas, music, texts and portraits from wow-data's pins and opens a pull request when one changes, merged once its checks pass. A regenerated table must keep every id a saved find may hold.\n\nIts sister addon, [Yonder](/projects/yonder), shares its tooling and conventions.\n","mealbook":"# Mealbook\n\nMealbook is a World of Warcraft addon for cooks, on Classic Era and World of Warcraft: Forever. Each recipe the character knows gets a page written by its side's chef, Kendor Kabonka in Stormwind or Eunice Burch in the Undercity, above the game's facts about the dish. A road plans the climb to 300, a Hunts tab lists the recipes no shop of the side keeps, and an ingredient's tooltip names the known dishes it goes into. It reads in English and French.\n\n## How it's built\n\n`scripts/recipes.ts` builds each game's recipes from [wow-data](/projects/wow-data)'s databases: every dish of the cooking skill line its world can teach, its ingredients, the skill it is learned at and where its colour changes, each recipe's sellers, droppers and quests, the side each vendor serves, and where each ingredient is sold, dropped, fished or gathered. Chapters are kept by hand; the script refuses a dish without one.\n\n- The road follows the game's skill-up rule (orange always gives a point, grey never, the chance falling in between) and picks the surest recipe at each point, counting casts as one over the chance. It adds a recipe to learn only when its chance of a point beats the best known recipe's by more than 0.1, and stops at each cap to say where the next rank is learned.\n- A recipe is a hunt when no shop of the side has it but a limited stock, a drop or a quest does, or only the other side gets it and it trades at a neutral auction house.\n- Every dish has a page from both chefs. `scripts/pages.ts` checks each page's length, refuses a semicolon or another dish's ingredient, and flags a translation whose English changed since it was stamped.\n- The saved book keeps ids only, and every game name is shown in the client's language.\n\nThe window and achievements come from [addon-kit](/projects/addon-kit)'s shared Lua.\n\n## How it's checked\n\n- A simulated game client plays a recipe learned, dishes cooked, the road and every tab on both games and in French. It holds the achievement check that runs after every dish cooked under 32 KB of garbage.\n- On the paper look, the simulation holds every skill colour at 3 to 1 contrast and distinct from the others.\n- CI lints the Lua, checks the language files and runs the simulations and script tests; a version tag runs them again before the release goes to GitHub, CurseForge and Wago.\n- A daily job, with wow-data's databases at hand, rebuilds the recipes, pages and language files from its pins, runs the full check, the recipes' and pages' checks among it, and opens a pull request when a file changes. A regenerated table must keep every id a saved book may hold.\n","second-wind":"# Second Wind\n\nSecond Wind is a World of Warcraft addon that writes a debrief once a fight that nearly killed the character, or did, is over: a health graph, the largest hits, and the emergency spells and items used or left ready. From the third debrief on, it shows what the close calls share. Nothing appears in combat. It runs on Classic Era, Hardcore, Season of Discovery and World of Warcraft: Forever, in English and French.\n\n## How it's built\n\nThe recorder keeps each fight's foes, hits, heals, health, casts and control lost, and what was ready when health first fell below half. Outside duels and battlegrounds, a fight that drops below the close-call threshold or ends in a death becomes a debrief, and every other fight is only tallied. Reading a debrief is a set of pure functions: the facts, then lessons that are rules over those facts (three foes at once, a guard unused, a fall from half health to the low point in three seconds), the two weightiest told. Patterns count traits across debriefs and set them against the tally of all fights. The voice gives counts, never advice.\n\n- Emergency spells are known by id at any rank, and each tool counts only where it applies: a protection potion only if harm of its school came, a bandage only after a long enough lull.\n- On Forever the combat log is closed to addons and the character's health is a secret value. Second Wind rebuilds health from each hit and heal the game reports, anchored on the game's own low-health warning at 35% or on the death recap, and reads the damage meter once combat ends; a debrief says when a health value is an estimate. `docs/forever.md` records the research and measurements, and `/wind probe` reports what the game exposed in the next fight.\n- Debriefs save ids rather than game names, named again in the client's language at each login.\n\nCreature portraits and names come from [wow-data](/projects/wow-data), the window from [addon-kit](/projects/addon-kit).\n\n## How it's checked\n\n- A simulated game client replays fights as the game sends them: hits, heals, stuns, a death with its recap, the combat log on Classic only and secret health on Forever. It runs on both games, on the paper look and as a French client, and each new behaviour is added with its replay.\n- CI lints the Lua, checks the language files and runs the simulations; a version tag runs them again before the release goes to GitHub, CurseForge and Wago.\n- A daily job rebuilds the creature and spell tables and the names in every language from wow-data's pins and opens a pull request when one changes. A regenerated table must keep every id a saved debrief may hold.\n","keyring":"# Keyring\n\nKeyring is a World of Warcraft addon that clears the minimap: other addons' buttons move into a drawer that opens from a key-shaped button on the minimap's ring, and the settings let the player leave any button where it was. One download covers Classic Era, Hardcore, Season of Discovery and World of Warcraft: Forever, in English and French. It carries none of addon-kit's shared Lua: it uses the game's own frames and look.\n\n## How it's built\n\n`Gather.lua` finds buttons through LibDBIcon's list and by name among the minimap's children: at login, shortly after, and whenever an addon loads or the drawer opens. It never takes the game's own buttons (they have secure global names), a protected frame (the game restricts those in combat), a map pin, or anything larger than 64 pixels.\n\n- While a button is held, its addon's `SetPoint`, `ClearAllPoints`, `SetParent` and `SetAllPoints` do nothing, so neither the addon nor a LibDBIcon refresh can pull it back out; its strata and level stay above the drawer the same way. A button the player leaves out goes back as it was, its own methods restored, and its strata and level too wherever the game lets an addon read them.\n- The drawer closes on the key, Escape or a click elsewhere, but not on a menu or tooltip that one of its buttons opened. `Bindings.xml` offers a key binding that opens and closes it, for a controller with no cursor on the minimap; nothing is bound until the player picks a key.\n\nKeyring shares only tooling with [addon-kit](/projects/addon-kit): the folder finder, the scripts' languages and packaging libraries, selene's game globals and the StyLua config are stamped copies, `kit:check` fails one that drifts, and the release and the binding check run the kit's own scripts.\n\n## How it's checked\n\n- `bun run check` runs the key binding check and `kit:check`, then `check:ci`: the language files, StyLua and selene, the simulation on Classic Era and on Forever, and the TOCs.\n- The simulation runs in a fake game of Keyring's own, with the game's buttons under secure names and LibDBIcon making its buttons as the library does. It plays a login among addon buttons, map pins and a protected frame, the drawer, the settings list, a reload and a French client.\n- CI runs `check:ci` on every push to `main` and every pull request, then builds the release package with the BigWigs packager and diffs it against the addon's folder.\n- A version tag runs the same checks and verifies the stores' tokens before one zip goes to GitHub, CurseForge and Wago; the stores can be held back for a test in the game.\n","goodwill":"# Goodwill\n\nGoodwill is a World of Warcraft addon for Classic Era and World of Warcraft: Forever that shows each faction's road to Exalted. For each faction the character can raise, the addon's book shows the distance to the next standing, the turn-ins in the bags and bank, the quests still open, the kills that still count and what each standing unlocks. Factions with a voice of their own tell a little more of their story at each new standing. It comes in English and French.\n\n## How it's built\n\n`scripts/factions.ts` builds one Lua table per game from [wow-data](/projects/wow-data), for the factions listed by hand in `data/factions.json`: the quests that raise each and what they require, the repeatable turn-ins, the kills and where they stop counting, what each standing unlocks. The client's Faction table adds how sister factions share reputation and where each race and class starts. The book lists a faction once the character gains above that start, and the character's own capital from the first login.\n\nSaved data keeps ids only, and names come by id in the client's language, never matched in English. `saved-ids.json` lists the tables whose ids a saved book may hold, and the check fails a regeneration that drops any of those ids.\n\nThe chapters are Markdown files, up to six a faction: start, Friendly, Honored, Revered, an aside halfway to Exalted, and Exalted. A paragraph tied to a quest shows once the reader has turned it in, or only until then. `docs/voices.md` holds the rules (a voice guarded at first and plain at Exalted, every fact from the game) and a card per voice. Every faction's chapters but the Darkmoon Faire's name the [Lorekeeper's Codex](/projects/lorekeepers-codex) pages they must not echo, and are read against them.\n\n`scripts/chapters.ts` builds one Lua file per language. It refuses a chapter that breaks the house style (a semicolon, a figure in the prose) or marks a repeatable quest, which is never flagged done, a faction missing one of its chapters, and a translation whose marked paragraphs differ from its English; it names each translation whose English changed since it was stamped. The settings, welcome page and achievements run on [addon-kit](/projects/addon-kit)'s shared Lua.\n\n## How it's checked\n\n- `bun run check` runs the key binding check, the kit's copy check, the saved-ids check and both generators in `--check` mode, then `check:ci`: Bun tests, French typography, the language files, StyLua and selene, the simulation and the TOCs.\n- The simulation plays it in the kit's simulated game client: rising standings, opening chapters, quest-tied paragraphs and the road with bags and bank, on Classic Era, Forever, a French client and the paper look.\n- CI runs `check:ci` on every push to `main` and every pull request and diffs the release package against the addon's folder; a version tag runs it again before publishing to GitHub, CurseForge and Wago.\n- A daily job reruns the generators from wow-data's pins and opens a pull request when a file changes, merged by itself once CI passes.\n","palaver":"# Palaver\n\nPalaver is a World of Warcraft addon for Classic Era and World of Warcraft: Forever that replaces the game's quest and gossip windows with a panel beside the NPC, who stays in view. Space or Enter accepts or continues, Escape says goodbye, and the number keys pick a line or a reward. Its way of talking to NPCs follows the DialogueUI addon.\n\n## How it's built\n\n`Game.lua` reads the game's pages through the same calls Blizzard's windows make, each read in Blizzard's source, pinned in wow-data, before it changes. Buttons, headings and NPC lines stay the game's own, in the client's language.\n\n`Core.lua` mutes Blizzard's windows at login, restored exactly by `/palaver off`. Escape, Goodbye, Decline or the panel's close button end a conversation; when Palaver steps the panel aside for a vendor, a trainer or a flight map, the conversation goes on. Keys act on release and only on the page they were pressed on, so a held Space never accepts the next quest, and on a long page Space first scrolls down (a setting, on by default), so the key never accepts a quest with its rewards unseen. A page that fails to draw goes back to Blizzard's handler.\n\n- `Hud.lua` hides the interface during a conversation and restores it at once for a fight, a popup or a cinematic.\n- `Camera.lua` plays DialogueUI's zoom on the speaker, saving every camera setting it changes so that after a crash the next login puts them back.\n- `Rewards.lua` marks the reward that sells for the most and the best upgrade by Palaver's own rule (class stat weights against the gear worn), asking no other addon.\n\nA quest's offer adds its level, kind (elite, dungeon, raid, PvP), place in its chain and suggested group size. `scripts/quests.ts` builds level, kind and chain from [wow-data](/projects/wow-data)'s databases into one Lua table per game; a chain follows the game's next-quest link alone, never a prerequisite. The window, panel and paper look come from [addon-kit](/projects/addon-kit)'s shared Lua.\n\n## How it's checked\n\n- `bun run check` runs the key binding check, the kit's copy check and the quest generator in `--check` mode, then `check:ci`: the language files, StyLua and selene, the simulation and the TOCs.\n- The simulation runs in the kit's simulated game client, with Blizzard's windows as each client registers them and a scripted NPC behind the gossip and quest APIs, on Classic Era, Forever, a French client and the paper look.\n- `RENDER=dir` writes the panel as HTML in its real colours for a look before a build, and a visual change is tested in the game.\n- CI runs `check:ci` on every push to `main` and every pull request and diffs the release package against the addon's folder; a version tag runs it again before publishing to GitHub, CurseForge and Wago.\n- A daily job rebuilds the quest facts from wow-data's pins; a change opens a pull request, merged by itself once CI passes.\n","primer":"# Primer\n\nPrimer is a class guide for World of Warcraft, on Classic Era and World of Warcraft: Forever, read in its own window between fights. For the character's class, level and build it gives the opening and loop of spells to press, the next talents to pick, and what the build is for, each line with its reason. Every class has a guide on Forever; on Classic Era the Warrior, the Paladin and the Mage do. It reads nothing in combat and sends nothing.\n\n## How it's built\n\nThe guide is data, not code: one hand-written file for each class and game it covers, `content/<game>/<class>.json`, with its builds, talent paths and level stages. `scripts/guide.ts` turns them into the addon's Lua; no code is written per class, and a stale generated file fails the check.\n\n- Facts come from [wow-data](/projects/wow-data)'s databases, by id: the generator checks every spell's name, level and place in the class's book, and every talent's ranks and prerequisites. A fact the tables lack is written as the guide's own and marked so in the data, or left out.\n- `facts.lock.json` records every fact a build read. When a patch moves one, the run fails naming the build and the fact, until a person rereads and clears it.\n- A character's build is read by feasibility, not by the tree with the most points: a build stays open as long as the points left can still fill its tree. A pick holds until the points can't reach it, and a drift is said once, never acted on. On Forever the level-10 question is the spec; the role follows.\n- Forever's builds claim no optimum: a talent order is \"the common choice\", with its price, and `scripts/meta-lib.ts` bans words such as best, optimal and meta.\n\n## How it's checked\n\n- Tests play Primer in [addon-kit](/projects/addon-kit)'s simulated game client, made strict: it refuses a call that the documentation in Blizzard's pinned interface source refuses, naming the function and the argument.\n- A matrix plays every class with a guide at eight levels from 1 to 60 on every tab, clicks everything shown, then levels up, respecs and fights. A case fails on a Lua error, a refused call, cut text, a missing icon or any read of the game in combat.\n- A Forever run answers each of the test game's calls with secret values, one at a time, flagged or not, and the window must not raise an error.\n- CI runs the checks that need no other repository on every push to `main` and every pull request, and compares the BigWigs packager's release package with the addon's folder.\n- A daily job rebuilds the guide from wow-data's pins, opens a pull request when a file changes and merges it once its checks pass; a moved fact fails it first. `saved-ids.json` keeps a regeneration from dropping a build id a character holds.\n","yonder":"# Yonder\n\nYonder is an Explorers' League field journal for World of Warcraft, on Classic Era, Hardcore, Season of Discovery and World of Warcraft: Forever, that fills in as a character travels. Its expeditions are riddles in verse, solved on the spot by reaching a place, speaking to someone, reading something or making the gesture the verse hints at, and posters for rare creatures to track down. A bestiary, an atlas, a tab of finds and one of achievements hold the rest, with a naturalist's note for every family and find.\n\n## How it's built\n\nThe authored text is Markdown: riddles and posters in `expeditions/<zone>.md`, family notes with their matching rules in `content/`, zone notes in `atlas/`, the finds' notes in `notes/`. `scripts/build.ts` sorts the original world's creatures into families (Forever's new ones are filed in the game when met) and writes one data file per game, keeping a paragraph marked `[classic]` or `[forever]` for that game alone. The game data comes through [wow-data](/projects/wow-data), the book's window through [addon-kit](/projects/addon-kit).\n\n- A resolver, `scripts/expeditions.py`, places each object and creature from the spawns in wow-data (the CMaNGOS Classic database, and Questie's records for Forever's new island), cross-checked against Wowhead's points frozen there. It refuses a riddle that needs a kill, repeats a discovery in its zone, overlaps a quest without a recorded review, or sits by a creature hostile to one side, unwarned. Each riddle carries a danger line from the spawns around it.\n- What a riddle is checked against ships only as salted hashes of 5-yard cells, sub-areas, keepers and gestures; the hints ship readable, and the texts a solved riddle unlocks are veiled.\n- A gesture is caught by its emote token, never its text, and nothing solves in combat, from a flight or as a ghost.\n- The journal saves the game's things by id, never by name, so every creature and place reads under the game's own name in the client's language, even after a switch. It reads in English and French.\n- Sharing what the game tells of the world is opt-in, and [Ravenpost](/projects/ravenpost) carries it.\n\n## How it's checked\n\n- `bun run check` runs the scripts' Bun and Python tests, StyLua and selene, and a simulated client replaying a dwarf's first hunts on Classic Era and on Forever, where addons get no combat log and some values are secret.\n- `scripts/riddle-solutions.test.ts` solves every riddle through the real Lua code under each client language, on both games.\n- `scripts/expeditions_test.py` undoes a hand review's fixes and expects the resolver to find every finding again.\n- CI runs the checks that need no other repository on every push to `main` and every pull request. A daily job regenerates the data from wow-data's pins, checks a new build's quests against every riddle, and merges once the checks pass; `saved-ids.json` keeps it from dropping an id a journal holds.\n\n[Lorekeeper's Codex](/projects/lorekeepers-codex) shares Yonder's tooling and conventions, in another voice.\n","yours-truly":"# Yours Truly\n\nYours Truly is a World of Warcraft addon for Classic Era and World of Warcraft: Forever in which the people whose quest chains a character finished write to the character, each in their own voice, about what the chain changed for them. A letter spends a while in the post, then waits sealed at a mailbox, and a book keeps every letter received. It reads in English and French.\n\n## How it's built\n\nNo addon can put mail in the game's mailbox, so a letter appears in a panel beside the mail window, laid out like the game's inbox: a row per letter, a seal to break, Open all. A letter's only notice is the game's own mail icon on the minimap, or a small one on the book's minimap button where the game's can't be shown: no chat line, no pop-up.\n\n- Turning in a letter's last quest posts it, and a mailbox delivers it once it has spent fifteen minutes of play in the post, one letter a visit, two when more than three wait. The time is kept by the addon's own clock, since asking the game for the time played prints a line in the chat. Letters earned before installing come as a backlog, delivered the same way.\n- Each writer is one Markdown file, `letters/<zone>/<writer>.md`: the ids of the letter, its anchor quests, the writer and the place, then the writer's card (the voice, what they never say) and the letter.\n- Who the writer is, what the player did and what came of it are the game's, from the anchor's quests in [wow-data](/projects/wow-data); the writer's life since is invented, small and off-screen. Nothing is enclosed, nothing is asked of the player, and no enemy the game brings back is called gone.\n- `scripts/letters.ts` checks each anchor, writer and place in each game's database, works out who can earn the letter, and writes the Lua. It refuses a semicolon, a token the game lacks, a body outside 70 to 180 words, game words such as \"quest\", and times a late letter would break, such as \"yesterday\".\n\n## How it's checked\n\n- A simulation in [addon-kit](/projects/addon-kit)'s game client turns a chain in, waits out the post, breaks a seal, fills in the player's name, holds back the other side's letters and delivers a backlog, on both games and on a French client.\n- Bun tests cover the French typography check and the translation stamps; StyLua and selene lint the Lua. Each translation is read cold by a reviewing agent, then by a person.\n- CI runs the checks that need no other repository on every push to `main` and every pull request. A daily job rebuilds the letters from wow-data's pins and runs the full check, the letters' own among it; `saved-ids.json` keeps it from dropping a letter id a character holds. A version tag publishes one zip for both games on GitHub, CurseForge and Wago.\n","gero":"# Gero\n\nGero is a 16-bit virtual machine and the toolchain that targets it, in Zig with no runtime dependencies: one `gero` binary assembles, compiles, runs, disassembles, formats, tests and benchmarks programs, and serves as a language server. A program ships as one `.gx` bytecode file, byte for byte the same wherever it's built, in a frozen format: a file built for another major version of the format is refused, never run. Gero Lab, the playground at the project's link, runs the same toolchain in the browser.\n\n## How it's built\n\nThe machine is in the line of the 6502, Z80 and 8086: 15 sixteen-bit registers, variable-length instructions, 64 KB of address space with a 16 KB window that switches between banks, and no floating point.\n\nThe language reads like Lua but compiles ahead of time to the assembler's bytecode, with types checked first: `Vec(T)`, tuples, enums with payloads, `T?` optionals, and a `match` that won't compile if it misses a variant. The specifications in `docs/` (the ISA, both languages, the diagnostics, the CLI, versioning) are the source of truth and change in the same pull request as the code.\n\nGero Lab holds no VM logic of its own: every assemble, compile, format and step goes through `gero.wasm`, a build target of the Gero repository. The page reaches it through a worker with a versioned protocol and runs a program in slices of a fixed instruction budget, so a tight loop can't freeze the page. A program is shared as a link whose fragment carries the compressed source, never a `.gx`, so the program itself never reaches a server. Each deploy fetches the module from a pinned Gero release.\n\n## How it's checked\n\n- `zig build verify` must pass before a push: the unit tests, the format check, the project's own linter (explicit error sets, a reason above every `@as`, `@ptrCast`, `@alignCast` and `@bitCast`, a doc comment on every public declaration, a test file for the files under `src/`), the example gates, and a golden corpus that fails any change to the examples' bytecode that hasn't been approved again.\n- Every assembly and Gero block in the specs of both languages and in the two teaching books is assembled or parsed, unless it is marked a fragment, and each diagnostic code is checked against its documentation and the code that emits it.\n- CI runs the tests on Linux (all four release modes on `main`), macOS and Windows and under wasmtime, and on each system builds and runs every example, diffs its output, round-trips the assembly ones through the disassembler and runs each again through the wasm module.\n- `zig build ci`, the local gate before a release, adds a benchmark gate that holds exact cycle counts against committed baselines, and a feature or fix needs a changeset.\n- Gero Lab's tests drive the real `gero.wasm`, never a mock, built from Gero's source in its CI.\n","addon-kit":"# addon-kit\n\naddon-kit is the shared Lua kit of the World of Warcraft addons on this site, and the scripts that run across the addons' repositories. Nine of the addons carry the kit: [Hearthtale](/projects/hearthtale), [Lorekeeper's Codex](/projects/lorekeepers-codex), [Yonder](/projects/yonder), [Second Wind](/projects/second-wind), [Palaver](/projects/palaver), [Mealbook](/projects/mealbook), [Goodwill](/projects/goodwill), [Yours Truly](/projects/yours-truly) and [Primer](/projects/primer). It gives their books one look with a theme each, and the parts every addon needs: events, the pieces of a window, the banners for a deed done, each character's settings and a welcome page.\n\n## How it's built\n\nEach addon commits a copy of `Kit.lua`, loaded into its own namespace, so two addons on different kit versions never clash and players install nothing extra. `kit:sync` writes the copy under a stamp line naming the kit commit it came from, with the kit's pictures, translations and the scripts' shared libraries. `kit:check` fails a copy that differs from the kit at its stamp, and the sync refuses kit code that isn't committed and pushed. [Keyring](/projects/keyring) takes the scripts alone.\n\nThe kit's words are translated once and copied into each addon, and the shared locale code refuses a translation that loses a colour code, a line break or a picture.\n\nThe kit also holds the addons' test battery: a mock of the client, a strict layer that refuses what Blizzard's API documentation (at a pinned version) says the client refuses, and a driver that makes the game's calls answer, one at a time, with the secret values of World of Warcraft: Forever.\n\nThe scripts:\n\n- `package-lib.ts` builds one test zip that every game loads, each from its own TOC, and checks the TOCs: every file they load present and tracked by git, every Lua file loaded.\n- `release.sh` wants an explicit version and a clean `main` in sync with origin, checks that no saved id is lost since the last release, runs the whole check, then pushes `main` and the tag together or not at all, for GitHub Actions to publish.\n- `ids.ts` stops a data regeneration from dropping an id a player's saved file holds.\n- `preflight.ts` checks, before a release, everything a script can (each TOC against [wow-data](/projects/wow-data)'s pinned builds, the store page, translation coverage, CI) and changes nothing.\n- `store.ts` puts each addon's store page and summary on CurseForge and Wago, and its description on GitHub, a dry run first.\n\n## How it's checked\n\n`bun run check` runs StyLua, selene with the addons' lint rules, the kit's Lua tests in LuaJIT and the Bun tests; a push wants a passing check stamped on the tree. The Lua tests drive the kit's pieces against stand-ins for the game (the select, the banners, events, the key binding) and assert, for several themes, that text on the paper look keeps at least 4.5 to 1 contrast; each addon's simulation tests the rest. `release.test.ts` plays each release case in scratch repositories.\n\nThe addons' copy of the [harness](/projects/harness) tools lives here too, stamped from the harness repository: a hand edit fails the check.\n","wow-data":"# wow-data\n\nwow-data is the build-time data pipeline behind the World of Warcraft addons on this site, all but Keyring. It turns the game client's own tables and two community databases into a SQLite database for each game, Classic Era and World of Warcraft: Forever, which the addons' scripts query to generate their data files. Nothing of it ships in an addon.\n\n## How it's built\n\n`pins.json` pins the three sources: the client's own tables at a build, in every client language; QuestieDB at a commit, merged by Questie's own engine; and the cmangos Classic database for what Questie lacks, such as books and loot odds. Names Questie doesn't translate come from Wowhead, fetched once and frozen in the repository. Each file downloads once into a shared cache, and no addon fetches its own.\n\nEvery link in the schema is the game's id; names live in one table, in every language, and every row names its source. A build stops rather than publish less than it should: a failed download, a language holding under 95% of English's names for a kind, a frozen file missing.\n\nDaily GitHub Actions jobs keep it current:\n\n- Pins: a pull request when the client's builds move within their product and major version, merged by itself once both databases build and pass their tests; the new databases then ship as a GitHub release.\n- Game data: each addon's job (Keyring has none) regenerates its files, opens a pull request only when one changes, and merges once its CI passes; a release to players stays a hand step. [addon-kit](/projects/addon-kit)'s `ids.ts` fails the job first if an id a player's saved file holds would be lost.\n- Players' facts: what players who opted in saw in the game, sent through [Ravenpost](/projects/ravenpost). A review drops any line with a link, markup, escape codes, a value out of bounds or an order to the reader, and holds free text until two players have seen it. Who saw a fact is kept as a hash of the account and the fact, so no one's facts can be tied together, and facts fill only what no source has.\n\nThe explorer, React on a Bun server, finds any name in eleven languages, gives each quest, creature, item and zone a page, draws positions on the client's maps and has a read-only SQL console.\n\n## How it's checked\n\n`bun run check` typechecks and runs the tests. The database tests hold both databases against facts from the game, and another runs the review's text rules over the game's own texts and fails if they drop one in a thousand. Those run where the databases are built: before each release of them and before the Pins job merges. CI runs the check and the explorer's typecheck and build on every push to `main` and every pull request.\n\nWork on the repository runs under the [harness](/projects/harness).\n","harness":"# harness\n\nharness is a set of tools for running Claude Code sessions on a software project: a task board, a quiet runner for checks, a review before each commit, and git hooks that hold sessions to them. It comes from the World of Warcraft addons' tooling, made general so that any project can adopt it with one command; Hundo and this site both run under it. The tools are TypeScript run by Bun and the git hooks are shell, with no dependencies.\n\n## How it's built\n\n- The board: one Markdown card per task, written through `board.ts` so no session hand-edits it, naming its session and the repositories it writes. By default the board is a lock: a session's commit is refused unless its running card names the repository and no other card holds it. A project whose sessions each work in a git worktree of their own can turn the lock off, and the board is then a list.\n- The quiet runner: `q.ts` keeps a check's output in a log file and prints one verdict line. A passing check stamps the git tree it ran on. An optional queue runs one check at a time on the machine, so parallel sessions don't starve each other's tests.\n- The review: `packet.ts` gathers what a review needs into one file, a read-only reviewer agent reads it, and `review.ts` records the verdict against the tree the commit will hold. A file changed afterwards leaves the commit without one.\n- The hooks: `commit-msg` refuses an AI co-author or \"generated with\" line. `pre-push` refuses a tree with no passing check, a change no review stands behind (documentation is waived), and an AI trailer that a rebase carried past `commit-msg`.\n- Sessions, a rule rather than a hook: each new task opens in a session of its own (`session.ts`, the `child` skill), which can send its questions, a push among them, to the session that opened it.\n\n`bun init.ts <project>` sets a project up: `harness.toml`, a copy of the tools in `harness/`, the hooks, permission prompts for GitHub and Vercel writes in Claude Code's settings, the reviewer and architect agents, and a rules section in `CLAUDE.md`. It commits nothing. The tools are copied rather than referenced, so CI, a worktree or another machine needs only the repository. Each copy carries a stamp naming the harness commit it came from, and `harness-sync.ts --check` fails on a hand edit. No tool hard-codes a project's folders or repository names: they come from `harness.toml`.\n\n## How it's checked\n\n`bun test` covers the tools, the hooks, setup and the queue; the tests stay in this repository and are never copied into a project. CI runs them on every pull request and every push to `main`. `docs/trial.md` records a trial on a throwaway repository in which each refusal fired in turn (no card, an AI trailer, no review, no passing check) until a fix, a check and a review let the push through.\n"};
const P={green:['#33ff66','#1a9c40','#031208'],amber:['#ffb000','#a86f00','#140b00'],white:['#e8eef8','#8a93a6','#0b0d12']};
const $=id=>document.getElementById(id),root=$('ph'),sc=$('sc'),pg=$('pg'),vw=$('vw');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const host=u=>u.replace(/^https?:\/\//,'').replace(/^mailto:/,'');
// a 1-bit icon (16x16) or glyph (8x8), as app/os/icons draws them: the inside in the tube's black, the outline in the phosphor
const px=([inside,outline],side,size,inv)=>`<svg aria-hidden="true" focusable="false" width="${size}" height="${size}" viewBox="0 0 ${side} ${side}" shape-rendering="crispEdges" style="display:block;flex:none"><path d="${inside}" fill="${inv?'var(--fg)':'var(--bg)'}"/><path d="${outline}" fill="${inv?'var(--bg)':'currentColor'}"/></svg>`;
const icon=(n,inv)=>px(D.icons[n],16,32,inv),glyph=(n,s=16)=>px(D.glyphs[n],8,s);
const ext=u=>u==='-'?'-':`<a class="u" href="${esc(u)}"${u.startsWith('https:')?' target="_blank" rel="noopener"':''}>${esc(host(u))}</a>`;
const pics=n=>`${n} picture${n===1?'':'s'}`;
const folderName=f=>D.folders.find(x=>x[0]===f)[1];
const rpath=p=>`~/projects/${p.folder}/${p.slug}/README`;
let current='/',shots=[],at=0,opener=null;

// the README, from app/content/readme/<slug>.md, in the site's Markdown subset
function inl(s){let o='',i=0;for(const m of s.matchAll(/`([^`]+)`|\[([^\]]+)\]\(([^)]+)\)/g)){o+=esc(s.slice(i,m.index));i=m.index+m[0].length;
 if(m[1]!=null)o+=`<code>${esc(m[1])}</code>`;else{const u=m[3],sl=u.startsWith('/projects/')&&u.slice(10);o+=sl?`<a href="${u}" data-go="${u}">${esc(m[2])}</a>`:ext(u).replace(esc(host(u))+'</a>',esc(m[2])+'</a>')}}
 return o+esc(s.slice(i))}
function md(src){let h='',ul=false;for(const l of src.split('\n')){if(!l.trim()){if(ul){h+='</ul>';ul=false}continue}
 if(l.startsWith('- ')){if(!ul){h+='<ul>';ul=true}h+=`<li><span>${inl(l.slice(2))}</span></li>`;continue}
 if(ul){h+='</ul>';ul=false}const m=/^(#{1,2}) (.*)/.exec(l);h+=m?`<h${m[1].length+1}>${inl(m[2])}</h${m[1].length+1}>`:`<p>${inl(l)}</p>`}
 return `<div class="md">${h}${ul?'</ul>':''}</div>`}

// a screenshot in its own colours; from the repo's public/, else a placeholder that says so
const img=(s,i)=>`<img src="../public${s.src}.webp" width="${s.w}" height="${s.h}" alt="${esc(s.alt)}" loading="${i?'lazy':'eager'}" decoding="async" onerror="this.outerHTML='<span class=&quot;ph-missing&quot; style=&quot;--ar:${s.w}/${s.h}&quot;>Placeholder: open this file from the repo to see ${s.src.split('/').pop()}</span>'">`;

function home(){
 const intro=D.readme[2].join(''),contact=D.contact.map(l=>`<dt>${esc(l[0].trim())}</dt><dd>${ext(l[1].href)}</dd>`).join('');
 const tabs=D.folders.map(([f,n])=>`<a href="#${f}" data-jump="${f}">${esc(n)} <span class="dim">${D.projects.filter(p=>p.folder===f).length}</span></a>`).join('');
 const folders=D.folders.map(([f,n])=>{const ps=D.projects.filter(p=>p.folder===f);
  return `<section class="fold" id="f-${f}" aria-labelledby="h-${f}"><h2 class="fh inv" id="h-${f}">${icon('folder',true)}<span>${esc(n)}</span><span class="n">${ps.length} item${ps.length===1?'':'s'}</span></h2><ul class="cards">${ps.map(card).join('')}</ul></section>`}).join('');
 return `<div class="wrap"><section class="intro" aria-labelledby="h-studio"><h1 class="h1" id="h-studio">${esc(D.studio)}</h1><p>${esc(intro)}</p><dl class="kv">${contact}</dl></section><nav class="tabs" aria-label="Folders">${tabs}</nav>${folders}</div>`}
const card=p=>`<li class="card"><h3><a href="/projects/${p.slug}" data-go="/projects/${p.slug}">${esc(p.name)}</a>${glyph('next')}</h3><p class="dim">${esc(p.kind)}</p><p class="ds">${esc(p.description)}</p>${p.shots.length?`<p class="px dim">${pics(p.shots.length)}</p>`:''}</li>`;

function project(slug){
 const p=D.projects.find(x=>x.slug===slug),i=D.projects.indexOf(p),prev=D.projects[i-1],next=D.projects[i+1];shots=p.shots;
 const list=p.shots.map((s,k)=>`<figure class="shot ${s.size}"><button data-v="${k}" aria-haspopup="dialog">${img(s,k)}</button><figcaption aria-hidden="true">${esc(s.alt)}</figcaption></figure>`).join('');
 const nav=(q,cls,label,g)=>q?`<a class="${cls}" href="/projects/${q.slug}" data-go="/projects/${q.slug}" rel="${cls==='nx'?'next':'prev'}"><span class="lb dim">${cls==='nx'?label+glyph(g,8):glyph(g,8)+label}</span><span>${esc(q.name)}</span></a>`:'<span></span>';
 return `<article class="wrap pj" aria-labelledby="h-pj"><a class="back" href="/#${p.folder}" data-go="/" data-jump="${p.folder}">${glyph('prev')}${esc(folderName(p.folder))}</a>
<h1 class="h1" id="h-pj">${esc(p.name)}</h1><p class="kind dim">${esc(p.kind)}</p><p class="ds">${esc(p.description)}</p>
<dl class="kv facts"><dt>Stack</dt><dd>${esc(p.stack)}</dd><dt>Link</dt><dd>${ext(p.link)}</dd><dt>Source</dt><dd>${ext(p.source)}</dd></dl>
${p.shots.length?`<section class="shots" aria-labelledby="h-shots"><h2 class="h2" id="h-shots"><span>Screenshots</span><span class="dim">${pics(p.shots.length)}</span></h2><div class="list">${list}</div></section>`:''}
<section class="pane" aria-label="README"><span class="pt" aria-hidden="true">${esc(rpath(p))}</span>${md(RM[p.slug])}</section>
<nav class="pn" aria-label="Projects">${nav(prev,'pv','Previous','prev')}${nav(next,'nx','Next','next')}</nav></article>`}

const footer=()=>`<p class="dim">${esc(D.os)}</p>`;

// the Control Panel, as the desktop's: the same settings, the same words
const cpb=$('cpb'),bd=$('bd'),sheet=$('sheet');
function openSheet(){const t=Object.keys(P).find(k=>root.style.getPropertyValue('--fg')===P[k][0])||'green';
 sheet.innerHTML=`<div class="tb inv"><h2 id="sh-t">Control Panel</h2><button class="xb" data-shut aria-label="Close"><span>${glyph('x')}</span></button></div>
<div class="cp"><span class="dim" id="l-ph">Phosphor</span><div class="opts" role="radiogroup" aria-labelledby="l-ph">${Object.keys(P).map(k=>`<label><input type="radio" name="ph" value="${k}"${k===t?' checked':''}>${k[0].toUpperCase()+k.slice(1)}</label>`).join('')}</div>
<span class="dim" id="l-fx">Effects</span><div class="opts" role="group" aria-labelledby="l-fx">${[['scan','Scanlines'],['glow','Glow'],['flick','Flicker']].map(([c,n])=>`<label><input type="checkbox" data-fx="${c}"${root.classList.contains(c)?' checked':''}>${n}</label>`).join('')}</div></div>`;
 bd.hidden=sheet.hidden=false;cpb.setAttribute('aria-expanded','true');sheet.querySelector('input[name=ph]:checked').focus()}
function closeSheet(){if(sheet.hidden)return;bd.hidden=sheet.hidden=true;sheet.innerHTML='';cpb.setAttribute('aria-expanded','false');cpb.focus()}
window.openPanel=openSheet;

function go(path,jump){current=path;closeViewer(true);const m=/^\/projects\/(.+)$/.exec(path);pg.innerHTML=m?project(m[1]):home();$('ft').innerHTML=footer();
 sc.style.scrollBehavior='auto';sc.scrollTop=0;if(jump){const s=$('f-'+jump);if(s)sc.scrollTop=s.offsetTop-44}sc.style.scrollBehavior='';}
window.go=go;

function show(){const s=shots[at],p=D.projects.find(x=>x.shots===shots),last=shots.length-1;
 vw.setAttribute('aria-label',`${p.name} screenshots`);
 vw.innerHTML=`<figure class="pane vp"><span class="pt">${esc(p.name)}</span><span class="pt r">${at+1} of ${shots.length}</span><div class="vbox" id="vbox">${img(s,0)}</div><figcaption class="vcap" aria-hidden="true">${esc(s.alt)}</figcaption></figure>
<div class="vb"><button data-step="-1" aria-disabled="${at===0}">${glyph('prev')}Previous</button><button data-step="1" aria-disabled="${at===last}">Next${glyph('next')}</button><button data-close>Close</button></div>`;}
function openViewer(k,from){at=k;opener=from||null;show();vw.hidden=false;vw.querySelector('[data-close]').focus()}
function closeViewer(silent){if(vw.hidden)return;vw.hidden=true;vw.innerHTML='';if(!silent&&opener)opener.focus()}
window.view=k=>openViewer(k);

root.addEventListener('click',e=>{
 const a=e.target.closest('a[data-go],a[data-jump]');if(a){e.preventDefault();a.dataset.go&&a.dataset.go!==current?go(a.dataset.go,a.dataset.jump):(a.dataset.jump?go('/',a.dataset.jump):go('/'));return}
 const v=e.target.closest('[data-v]');if(v){openViewer(+v.dataset.v,v);return}
 const st=e.target.closest('[data-step]');if(st){if(st.getAttribute('aria-disabled')!=='true'){at+=+st.dataset.step;show();vw.querySelector(`[data-step="${st.dataset.step}"]`).focus()}return}
 if(e.target.closest('[data-close]')){closeViewer();return}
 if(e.target.closest('#cpb')){openSheet();return}
 if(e.target.closest('[data-shut]')||e.target===bd)closeSheet();});
root.addEventListener('change',e=>{const t=e.target;if(t.name==='ph')setTheme(t.value);if(t.dataset.fx)root.classList.toggle(t.dataset.fx,t.checked)});
document.addEventListener('keydown',e=>{if(!sheet.hidden){if(e.key==='Escape')closeSheet();return}if(vw.hidden)return;if(e.key==='Escape')closeViewer();else if(e.key==='ArrowLeft'&&at>0){at--;show()}else if(e.key==='ArrowRight'&&at<shots.length-1){at++;show()}});
let sx=null;vw.addEventListener('pointerdown',e=>{if(e.target.closest('#vbox'))sx=e.clientX});
vw.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)<40)return;const n=at+(dx<0?1:-1);if(n>=0&&n<shots.length){at=n;show()}});

function setTheme(t){const [f,d,b]=P[t];root.style.setProperty('--fg',f);root.style.setProperty('--dim',d);root.style.setProperty('--bg',b);root.querySelectorAll('input[name=ph]').forEach(r=>{r.checked=r.value===t})}
window.setTheme=setTheme;
function setFrame(z){const [w,h]=z.split('x').map(Number);root.style.width=w+'px';root.style.height=h+'px';document.body.style.width=Math.max(680,w+28)+'px'}
window.setFrame=setFrame;
$('brand').innerHTML=icon('cat')+`<span>${esc(D.studio)}</span>`;cpb.innerHTML=icon('panel');$('cpo').onclick=openSheet;
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>setTheme(b.dataset.q));
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));
document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>setFrame(b.dataset.z));
go('/');
</script>
